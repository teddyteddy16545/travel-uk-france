<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東歐聖誕環線 (12月)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;700&family=Inter:wght@700;900&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; background: linear-gradient(135deg, #0f172a, #115e59); color: #fff; text-align: center; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
    .card { background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); max-width: 600px; }
    h1 { font-family: 'Noto Serif TC', serif; font-size: 36px; margin-bottom: 10px; }
    .pill { display: inline-block; background: rgba(255,255,255,0.15); padding: 5px 15px; border-radius: 20px; font-size: 14px; margin: 5px; }
    .budget { font-family: 'Inter'; font-size: 40px; font-weight: 900; color: #facc15; margin: 20px 0; }
    .table-container { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 20px; margin-top: 20px; text-align: left; }
    p { line-height: 1.6; font-size: 14px; color: rgba(255,255,255,0.9); }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎄 中東歐聖誕市集 (7天)</h1>
    <p>不搭飛機的浪漫金三角！享受東歐的極低物價與絕美雪景。</p>
    
    <div style="margin: 20px 0;">
      <span class="pill">🇨🇿 布拉格</span> ➔ <span class="pill">🇭🇺 布達佩斯</span> ➔ <span class="pill">🇦🇹 維也納</span> ➔ <span class="pill">🇦🇹 哈修塔特</span>
    </div>

    <div class="budget">€ 455 <span style="font-size:16px;">(約 16,000 NTD)</span></div>
    
    <div class="table-container">
      <p><strong>🚌 交通神解 (€75)：</strong>純陸路！搭乘 Flixbus 與 RegioJet，最後從薩爾斯堡回程時，直接使用你的 <strong>49歐 D-Ticket</strong> 免費搭回雷根斯堡。</p>
      <p><strong>🛏️ 住宿 (€180)：</strong>6 晚青旅。布拉格與布達佩斯住宿超便宜，可稍微平衡哈修塔特高昂的住宿費。</p>
      <p><strong>🍷 飲食市集 (€200)：</strong>品嚐熱紅酒 (Glühwein)、煙囪捲 (Trdelník) 以及泡布達佩斯塞切尼溫泉！</p>
    </div>
  </div>
</body>
</html>
