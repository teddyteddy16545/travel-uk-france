<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>義大利夏末狂歡 (9月)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;700&family=Inter:wght@700;900&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; background: linear-gradient(135deg, #1b5e20, #b71c1c); color: #fff; text-align: center; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
    .card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); max-width: 600px; }
    h1 { font-family: 'Noto Serif TC', serif; font-size: 36px; margin-bottom: 10px; }
    .pill { display: inline-block; background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 20px; font-size: 14px; margin: 5px; }
    .budget { font-family: 'Inter'; font-size: 40px; font-weight: 900; color: #facc15; margin: 20px 0; }
    .table-container { background: rgba(0,0,0,0.2); border-radius: 10px; padding: 20px; margin-top: 20px; text-align: left; }
    p { line-height: 1.6; font-size: 14px; color: rgba(255,255,255,0.9); }
  </style>
</head>
<body>
  <div class="card">
    <h1>🇮🇹 義大利夏末狂歡 (4天)</h1>
    <p>抓緊歐洲入冬前的溫暖陽光，完成吃道地義大利麵的願望。</p>
    
    <div style="margin: 20px 0;">
      <span class="pill">羅馬 (競技場)</span> ➔ <span class="pill">佛羅倫斯 (大牛排)</span> ➔ <span class="pill">威尼斯 (水都)</span>
    </div>

    <div class="budget">€ 330 <span style="font-size:16px;">(約 11,500 NTD)</span></div>
    
    <div class="table-container">
      <p><strong>✈️ 交通 (€110)：</strong>MUC 或 NUE 機場廉航直飛，境內搭乘 Italo 高鐵提早買極便宜。</p>
      <p><strong>🛏️ 住宿 (€120)：</strong>3 晚高評分青旅床位 (約 €40/晚)。</p>
      <p><strong>🍝 飲食雜支 (€100)：</strong>鎖定當地人的 Trattoria 小餐館，遠離觀光客廣場的餐廳。</p>
    </div>
  </div>
</body>
</html>
