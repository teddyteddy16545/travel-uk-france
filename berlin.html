<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>柏林歷史週末 (10月)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;700&family=Inter:wght@700;900&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; background: linear-gradient(135deg, #422006, #f59e0b); color: #fff; text-align: center; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
    .card { background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); max-width: 600px; }
    h1 { font-family: 'Noto Serif TC', serif; font-size: 36px; margin-bottom: 10px; }
    .pill { display: inline-block; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px; font-size: 14px; margin: 5px; }
    .budget { font-family: 'Inter'; font-size: 40px; font-weight: 900; color: #facc15; margin: 20px 0; }
    .table-container { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 20px; margin-top: 20px; text-align: left; }
    p { line-height: 1.6; font-size: 14px; color: rgba(255,255,255,0.9); }
  </style>
</head>
<body>
  <div class="card">
    <h1>🇩🇪 柏林歷史週末 (3天)</h1>
    <p>西歐最便宜首都！不需搭飛機的德國國內文化朝聖之旅。</p>
    
    <div style="margin: 20px 0;">
      <span class="pill">Regensburg Hbf</span> 🚆 <span class="pill">Berlin Hbf</span> ➔ <span class="pill">布蘭登堡門 / 東邊畫廊</span>
    </div>

    <div class="budget">€ 160 <span style="font-size:16px;">(約 5,500 NTD)</span></div>
    
    <div class="table-container">
      <p><strong>🚆 交通 (€40)：</strong>DB Super Sparpreis 超級早鳥票或 FlixTrain 綠色列車。</p>
      <p><strong>🛏️ 住宿 (€60)：</strong>2 晚青旅床位，柏林青旅選擇極多且平價。</p>
      <p><strong>🌭 飲食雜支 (€60)：</strong>柏林街頭的 Döner Kebab 與咖哩香腸 (Currywurst) 是窮遊神物，一餐不到 €6！</p>
    </div>
  </div>
</body>
</html>
